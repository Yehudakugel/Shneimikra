{% extends "base.html" %}
{% block body %}
<div style="max-width:420px;margin:0 auto">
{% if mode == 'signup' %}
  <h1>Create your account</h1>
  <p class="muted">It takes a moment. Your first portion opens right after.</p>
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="name">Name</label><input id="name" name="name" autocomplete="name" value="{{ form.get('name','') }}" required>
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" value="{{ form.get('username','') }}" required>
    <label for="password">Password <span class="muted">(6 or more characters)</span></label><input id="password" type="password" name="password" autocomplete="new-password" minlength="6" required>
    <button class="btn" style="margin-top:24px">Start learning</button>
  </form>
  <p class="center small muted" style="margin-top:18px">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% else %}
  <h1>Log in</h1>
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" value="{{ form.get('username','') }}" required>
    <label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="btn" style="margin-top:24px">Log in</button>
  </form>
  <p class="center small muted" style="margin-top:18px">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
{% endif %}
</div>
{% endblock %}
