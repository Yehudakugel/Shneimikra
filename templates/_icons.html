{% macro icon(name, size=22) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'play' %}<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>
{%- elif name == 'pause' %}<rect x="7" y="5.5" width="3.2" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="13.8" y="5.5" width="3.2" height="13" rx="1" fill="currentColor" stroke="none"/>
{%- elif name == 'prev' %}<path d="M6 6v12M18 6l-9 6 9 6z"/>
{%- elif name == 'next' %}<path d="M18 6v12M6 6l9 6-9 6z"/>
{%- elif name == 'tap' %}<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.9-2.6L4.6 15a1.5 1.5 0 0 1 2.4-1.8L9 15"/>
{%- elif name == 'auto' %}<path d="M4 6h10M4 12h10M4 18h6"/><path d="M16 14.5v6l5-3z" fill="currentColor" stroke="none"/>
{%- elif name == 'listen' %}<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6.5" rx="1.5"/><rect x="16.5" y="14" width="4" height="6.5" rx="1.5"/>
{%- elif name == 'check' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'book' %}<path d="M12 6.5C10.5 5.2 8 4.5 4 4.5v14c4 0 6.5.7 8 2 1.5-1.3 4-2 8-2v-14c-4 0-6.5.7-8 2zM12 6.5v14"/>
{%- elif name == 'phone' %}<path d="M5 4h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.3 6.3l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/>
{%- elif name == 'share' %}<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v6.5h14V13"/>
{%- elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'gift' %}<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-1.5-3.5-5-4.5-5-2s3 2 5 2zm0 0c1.5-3.5 5-4.5 5-2s-3 2-5 2z"/>
{%- elif name == 'speed' %}<path d="M12 20a8 8 0 1 1 8-8M12 12l4-3"/>
{%- endif %}</svg>
{%- endmacro %}
